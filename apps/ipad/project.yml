name: LunaCanvas
options:
  bundleIdPrefix: com.lunalogs
  deploymentTarget:
    iOS: "17.0" # 草案，待 ADR-0001 核实后固定
targets:
  LunaCanvas:
    type: application
    platform: iOS
    sources:
      - LunaCanvas
    info:
      path: LunaCanvas/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunalogs.lunacanvas
        TARGETED_DEVICE_FAMILY: "2" # iPad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "LunaCanvas"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    dependencies:
      - package: ZIPFoundation
  LunaCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LunaCanvasTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: LunaCanvas
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.20
